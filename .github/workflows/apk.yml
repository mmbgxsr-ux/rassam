name: Build APK
on:
  workflow_dispatch:
    inputs:
      allow_warn:
        description: "اكمل البناء حتى لو ظهر SKIP/WARN مهم (1 = نعم)"
        required: false
        default: "0"
concurrency:
  group: build-apk
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KS_B64: ${{ secrets.KS_B64 }}
      KS_PASS: ${{ secrets.KS_PASS }}
      ALLOW_WARN: ${{ inputs.allow_warn }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: rassam-npm-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: |
            rassam-npm-${{ runner.os }}-
      - run: bash build.sh
      - name: Summary (success)
        if: success()
        run: |
          {
            echo "### Rassam APK"
            echo '```'
            ls -lh out/rassam.apk
            grep -E "versionCode|versionName" android/app/build.gradle || true
            grep -A5 "OFFLINE-CHECK" build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Summary (failure)
        if: failure()
        run: |
          {
            echo "### Build failed"
            echo '```'
            grep -E "SKIP|WARN|BUILD STOPPED" build.log 2>/dev/null | head -30 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rassam-build
          retention-days: 30
          if-no-files-found: warn
          path: |
            out/rassam.apk
            build.log
