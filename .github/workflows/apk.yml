name: Build APK
on:
  workflow_dispatch:
    inputs:
      allow_warn:
        description: "اكمل البناء حتى لو ظهر SKIP/WARN مهم (1 = نعم)"
        required: false
        default: "0"
concurrency:
  group: build-apk
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KS_B64: ${{ secrets.KS_B64 }}
      KS_PASS: ${{ secrets.KS_PASS }}
      ALLOW_WARN: ${{ inputs.allow_warn }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Cache npm and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: rassam-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            rassam-${{ runner.os }}-
      - run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rassam-build
          retention-days: 30
          if-no-files-found: error
          path: |
            out/rassam.apk
            build.log
